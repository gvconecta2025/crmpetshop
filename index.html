<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pet Shops</title>
    <!-- Tailwind CSS para o Design -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <!-- React -->
    <script src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)" crossorigin></script>
    <script src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)" crossorigin></script>
    <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>
    <!-- Tesseract (Inteligência Artificial para ler imagens) -->
    <script src="[https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js](https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js)"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "[https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js](https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js)";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc } from "[https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js](https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js)";

        // ==========================================
        // ⚠️ COLOQUE AQUI AS SUAS CHAVES DO FIREBASE ⚠️
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const { useState, useEffect } = React;

        // Ícones do sistema
        const Icons = {
            Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Image: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
            Message: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>,
            Grip: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
        };

        function App() {
            // Proteção contra ecrã branco: Verifica se configurou as chaves
            if (firebaseConfig.apiKey === "SUA_API_KEY") {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-red-50 p-6">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-lg text-center border-t-4 border-red-500">
                            <h1 className="text-2xl font-bold text-red-600 mb-4">Quase lá! Faltam as Chaves do Firebase 🔑</h1>
                            <p className="text-slate-700 mb-4">Para que a tela não fique em branco, precisa de ligar o seu projeto à base de dados.</p>
                            <p className="text-slate-600 text-sm bg-slate-100 p-3 rounded">Vá ao seu ficheiro <code>index.html</code> no GitHub e substitua <strong>"SUA_API_KEY"</strong> e os restantes valores pelas chaves reais do seu projeto Firebase (linha 28 do código).</p>
                        </div>
                    </div>
                );
            }

            // Iniciar Firebase de forma segura
            let app, db;
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
            } catch (error) {
                console.error("Erro a iniciar o Firebase:", error);
            }

            const [leads, setLeads] = useState([]);
            const [columns] = useState([
                { id: 'col-1', title: 'Novos Leads' },
                { id: 'col-2', title: 'Em Contato' },
                { id: 'col-3', title: 'Apresentação' },
                { id: 'col-4', title: 'Fechado' }
            ]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [newLeadText, setNewLeadText] = useState('');

            // Ligação ao Firebase em tempo real
            useEffect(() => {
                if (!db) return;
                const unsubscribe = onSnapshot(collection(db, 'leads'), (snapshot) => {
                    const fetchedLeads = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    fetchedLeads.sort((a, b) => b.createdAt - a.createdAt);
                    setLeads(fetchedLeads);
                });
                return () => unsubscribe();
            }, []);

            const handlePaste = async (e) => {
                const items = e.clipboardData.items;
                let imageFile = null;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        imageFile = items[i].getAsFile();
                        break;
                    }
                }

                if (imageFile) {
                    e.preventDefault();
                    setIsProcessing(true);
                    try {
                        const result = await window.Tesseract.recognize(imageFile, 'por');
                        const text = result.data.text;
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        
                        let name = "Novo Lead";
                        let address = "";
                        let phone = "";

                        const phoneMatch = text.match(/(?:\(\d{2}\)\s?)?\d{4,5}-\d{4}/);
                        if (phoneMatch) phone = phoneMatch[0];

                        if (lines.length > 0) {
                            if (lines[0].toLowerCase().includes('pet shop') && lines.length > 1) name = lines[1];
                            else name = lines[0];
                        }

                        const addressLine = lines.find(l => l.toLowerCase().includes('rua') || l.toLowerCase().includes('avenida') || l.toLowerCase().includes('praça') || l.toLowerCase().includes('centro'));
                        if (addressLine) address = addressLine;

                        await addDoc(collection(db, 'leads'), {
                            name, phone, address, rawText: text, columnId: columns[0].id, notes: '', createdAt: Date.now()
                        });
                    } catch (error) {
                        console.error("Erro OCR:", error);
                        alert("Não foi possível ler a imagem.");
                    } finally {
                        setIsProcessing(false);
                    }
                }
            };

            const handleManualAdd = async (e) => {
                e.preventDefault();
                if (!newLeadText.trim() || !db) return;
                await addDoc(collection(db, 'leads'), { name: newLeadText, phone: '', address: '', columnId: columns[0].id, notes: '', createdAt: Date.now() });
                setNewLeadText('');
            };

            const updateLead = async (id, field, value) => { if (db) await updateDoc(doc(db, 'leads', id), { [field]: value }); };
            const deleteLead = async (id) => { if (db && window.confirm('Eliminar Lead?')) await deleteDoc(doc(db, 'leads', id)); };

            const onDragStart = (e, id) => e.dataTransfer.setData('leadId', id);
            const onDragOver = (e) => e.preventDefault();
            const onDrop = async (e, columnId) => {
                const leadId = e.dataTransfer.getData('leadId');
                if (leadId) await updateLead(leadId, 'columnId', columnId);
            };

            const openWhatsApp = (phone) => {
                if (!phone) return;
                let cleanPhone = phone.replace(/\D/g, '');
                if (cleanPhone.length >= 10 && !cleanPhone.startsWith('55')) cleanPhone = '55' + cleanPhone;
                window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}`, '_blank');
            };

            return (
                <div className="min-h-screen p-6 font-sans flex flex-col">
                    <div className="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h1 className="text-2xl font-bold text-slate-800 mb-4">CRM Pet Shops</h1>
                        <div className="flex flex-col md:flex-row gap-6">
                            <div 
                                className={`flex-1 border-2 border-dashed rounded-xl p-8 flex flex-col items-center justify-center transition-all cursor-text outline-none ${isProcessing ? 'bg-blue-50 border-blue-300' : 'bg-slate-50 border-slate-300'}`}
                                onPaste={handlePaste} tabIndex={0}
                            >
                                {isProcessing ? (
                                    <p className="text-blue-700 font-medium">A extrair dados da imagem... ⏳</p>
                                ) : (
                                    <>
                                        <div className="bg-white p-3 rounded-full shadow-sm mb-3"><Icons.Image /></div>
                                        <p className="text-slate-700 font-semibold text-lg">Área de Captura Rápida</p>
                                        <p className="text-slate-500 mt-1 text-center text-sm">Clique aqui e faça <kbd className="bg-slate-200 px-2 py-1 rounded font-mono">Ctrl + V</kbd></p>
                                    </>
                                )}
                            </div>
                            <div className="w-full md:w-1/3 flex flex-col justify-center">
                                <form onSubmit={handleManualAdd} className="flex gap-2">
                                    <input type="text" value={newLeadText} onChange={(e) => setNewLeadText(e.target.value)} placeholder="Nome do Pet Shop..." className="flex-1 border border-slate-300 rounded-lg px-4 py-2" />
                                    <button type="submit" className="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition"><Icons.Plus /></button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-x-auto pb-6">
                        <div className="flex gap-6 min-w-max h-full">
                            {columns.map(column => (
                                <div key={column.id} className="w-80 bg-slate-200/60 rounded-2xl p-4 flex flex-col border border-slate-200" onDragOver={onDragOver} onDrop={(e) => onDrop(e, column.id)}>
                                    <h2 className="font-bold text-slate-700 mb-4 px-1">{column.title} <span className="bg-slate-300 text-slate-600 text-xs py-0.5 px-2 rounded-full">{leads.filter(l => l.columnId === column.id).length}</span></h2>
                                    <div className="flex-1 overflow-y-auto space-y-3 min-h-[150px]">
                                        {leads.filter(l => l.columnId === column.id).map(lead => (
                                            <div key={lead.id} draggable onDragStart={(e) => onDragStart(e, lead.id)} className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 cursor-grab hover:shadow-md transition">
                                                <div className="flex items-start justify-between mb-3">
                                                    <div className="flex items-center gap-2 w-[85%]">
                                                        <span className="text-slate-300"><Icons.Grip /></span>
                                                        <input type="text" value={lead.name} onChange={(e) => updateLead(lead.id, 'name', e.target.value)} className="font-bold text-slate-800 bg-transparent w-full focus:outline-none focus:bg-slate-50 px-1 rounded" />
                                                    </div>
                                                    <button onClick={() => deleteLead(lead.id)} className="text-slate-300 hover:text-red-500 transition"><Icons.Trash /></button>
                                                </div>
                                                <div className="space-y-2 mb-4">
                                                    <input type="text" value={lead.phone} onChange={(e) => updateLead(lead.id, 'phone', e.target.value)} placeholder="Telefone..." className="w-full text-sm text-slate-600 bg-transparent focus:outline-none border-b border-slate-100 px-1 focus:border-slate-300" />
                                                    <input type="text" value={lead.address} onChange={(e) => updateLead(lead.id, 'address', e.target.value)} placeholder="Endereço..." className="w-full text-xs text-slate-500 bg-transparent focus:outline-none border-b border-slate-100 px-1 focus:border-slate-300" />
                                                </div>
                                                <textarea value={lead.notes || ''} onChange={(e) => updateLead(lead.id, 'notes', e.target.value)} placeholder="+ Inserir observações..." className="w-full text-sm bg-yellow-50/50 border border-yellow-200/60 rounded-lg p-2 min-h-[60px] focus:outline-none focus:ring-1 focus:ring-yellow-400" />
                                                <button onClick={() => openWhatsApp(lead.phone)} disabled={!lead.phone} className="mt-3 w-full bg-[#25D366] disabled:bg-slate-300 text-white py-2 rounded-lg font-medium flex items-center justify-center gap-2 hover:bg-[#1da851] transition">
                                                    <Icons.Message /> Conversar
                                                </button>
                                            </div>
                                        ))}
                                        {leads.filter(l => l.columnId === column.id).length === 0 && (
                                            <div className="h-20 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center text-slate-400 text-sm">
                                                Arraste os leads para aqui
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
