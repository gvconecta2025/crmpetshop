<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pet Shops - Kanban V5.5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-ghost { opacity: 0.5; background-color: #e2e8f0; }
        .col-ghost { opacity: 0.4; border: 2px dashed #94a3b8; }
        .history-item { border-left: 2px solid #e2e8f0; padding-left: 10px; margin-bottom: 10px; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .highlight-match { background-color: #fef08a !important; color: #854d0e !important; border-radius: 4px; transition: all 0.3s ease; }
        .active-search-match { background-color: #f97316 !important; color: #ffffff !important; box-shadow: 0 0 0 3px #fed7aa; transform: scale(1.02); z-index: 10; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div class="p-6 pb-2 shrink-0">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <h1 class="text-2xl font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-paw mr-2 text-blue-600"></i>CRM Pet Shops
                    <span class="text-[10px] font-bold bg-slate-800 text-amber-400 px-2 py-1 rounded ml-3 uppercase tracking-widest"><i class="fa-solid fa-bolt mr-1"></i> Versão 5.5</span>
                </h1>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <button id="btnFilterDuplicates" onclick="toggleDuplicates()" class="hidden bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-3 py-2 rounded-lg text-sm font-bold transition-all items-center gap-2 shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-copy"></i> <span id="dupCountText">Duplicados (0)</span>
                    </button>

                    <a href="disparador/" target="_blank" rel="noopener noreferrer" class="bg-[#25D366] hover:bg-[#1da851] text-white px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-paper-plane"></i> Disparador
                    </a>

                    <div class="relative flex-1 md:w-72 flex items-center bg-slate-50 border border-slate-200 rounded-lg focus-within:ring-2 focus-within:ring-blue-500 transition-all overflow-hidden h-10">
                        <i class="fa-solid fa-search text-slate-400 pl-3"></i>
                        <input type="text" id="searchInput" placeholder="Localizar Pet Shop..." class="w-full pl-2 pr-2 py-2 bg-transparent focus:outline-none text-sm">
                        
                        <div id="searchControls" class="hidden items-center bg-slate-100 border-l border-slate-200 px-2 h-full">
                            <span id="searchCounter" class="text-xs font-bold text-slate-500 mr-1 min-w-[30px] text-center">0/0</span>
                            <div class="flex flex-col">
                                <button onclick="prevSearch()" class="text-slate-400 hover:text-blue-600 transition leading-none py-0.5 px-1"><i class="fa-solid fa-caret-up text-[12px]"></i></button>
                                <button onclick="nextSearch()" class="text-slate-400 hover:text-blue-600 transition leading-none py-0.5 px-1"><i class="fa-solid fa-caret-down text-[12px]"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 border-t border-slate-100 pt-4 items-stretch">
                
                <div id="pasteZone" class="w-full md:w-1/4 border-2 border-dashed border-slate-300 bg-slate-50 rounded-xl p-3 flex flex-col items-center justify-center transition-all cursor-text outline-none hover:border-blue-400 focus:border-blue-500 focus:bg-white text-center" tabindex="0">
                    <div id="pasteInitialState" class="flex flex-col items-center">
                        <i class="fa-regular fa-image text-2xl text-slate-400 mb-1"></i>
                        <p class="text-slate-700 font-bold text-sm">Criar por Print</p>
                        <p class="text-slate-500 text-[10px] mt-1">Cole do Google Maps (<kbd class="bg-slate-200 px-1 rounded font-mono text-slate-600">Ctrl+V</kbd>)</p>
                    </div>
                    <div id="pasteProcessingState" class="hidden flex-col items-center">
                        <i class="fa-solid fa-circle-notch fa-spin text-xl text-blue-500 mb-1"></i>
                        <p class="text-blue-700 font-bold text-xs">A ler imagem...</p>
                    </div>
                </div>

                <div class="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col justify-between shadow-inner">
                    <div class="flex flex-col lg:flex-row justify-between lg:items-end mb-3 gap-4">
                        <div class="shrink-0">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Volume Total</p>
                            <p class="text-3xl font-black text-slate-800 leading-none" id="dashTotalLeads">0</p>
                        </div>
                        <div id="dashMetrics" class="flex gap-2 overflow-x-auto custom-scrollbar pb-1 items-end w-full lg:justify-end">
                            </div>
                    </div>
                    <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden flex" id="dashProgressBar">
                        </div>
                </div>

                <div class="w-full md:w-1/3 flex flex-col justify-center bg-white border border-slate-200 p-3 rounded-xl shadow-sm">
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-2">Novo Lead Manual</label>
                    <form id="manualForm" class="flex flex-col gap-2">
                        <input type="text" id="manualName" placeholder="Nome da Loja..." class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-xs font-bold" required>
                        <div class="flex gap-2">
                            <input type="text" id="manualPhone" placeholder="Telefone/Celular..." class="w-1/3 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-xs">
                            <input type="text" id="manualAddress" placeholder="Endereço ou Localização..." class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-xs">
                        </div>
                        <button type="submit" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 transition shadow-sm text-xs font-bold w-full mt-1">
                            <i class="fa-solid fa-plus mr-1"></i> Adicionar Lead
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 overflow-x-auto p-6 pt-2 custom-scrollbar">
        <div class="flex gap-6 h-full items-start" id="kanbanBoard">
            </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO FIREBASE E VARIÁVEIS
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let columnsData = [];
        let leadsData = [];
        let draggedLeadId = null;
        let draggedColId = null; 
        let expandedLeads = new Set();
        
        let currentSearchTerm = "";
        let searchMatches = []; 
        let currentSearchIndex = -1; 
        let showOnlyDuplicates = false;

        const columnColors = [
            { bg: 'bg-blue-500', text: 'text-blue-600', dot: 'text-blue-500', lightBg: 'bg-blue-50' },
            { bg: 'bg-red-500', text: 'text-red-600', dot: 'text-red-500', lightBg: 'bg-red-50' },
            { bg: 'bg-slate-400', text: 'text-slate-600', dot: 'text-slate-400', lightBg: 'bg-slate-100' },
            { bg: 'bg-green-500', text: 'text-green-600', dot: 'text-green-500', lightBg: 'bg-green-50' },
            { bg: 'bg-purple-500', text: 'text-purple-600', dot: 'text-purple-500', lightBg: 'bg-purple-50' }
        ];

        const boardEl = document.getElementById('kanbanBoard');
        const searchInput = document.getElementById('searchInput');
        const searchControls = document.getElementById('searchControls');
        const searchCounter = document.getElementById('searchCounter');

        // Escutar Dados
        db.collection('columns').orderBy('order').onSnapshot(snap => {
            columnsData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderBoard();
        });
        db.collection('leads').onSnapshot(snap => {
            leadsData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            leadsData.sort((a, b) => b.createdAt - a.createdAt);
            renderBoard();
        });

        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        
        // NOVA MÁSCARA (Resolve fixo e celular)
        function mascaraTelefoneInteligente(valorPuro) {
            if(!valorPuro) return '';
            let val = valorPuro.replace(/\D/g, ''); 
            if (val.startsWith('55') && val.length > 11) val = val.substring(2);
            if (val.startsWith('0')) val = val.substring(1);
            
            if (val.length === 0) return '';
            if (val.length <= 2) return val;
            if (val.length <= 6) return '(' + val.substring(0,2) + ') ' + val.substring(2);
            if (val.length === 10) return '(' + val.substring(0,2) + ') ' + val.substring(2,6) + '-' + val.substring(6); // Fixo
            return '(' + val.substring(0,2) + ') ' + val.substring(2,7) + '-' + val.substring(7,11); // Celular
        }

        window.scrollToTop = (colId) => {
            const container = document.querySelector(`.kanban-scroll-container[data-col-id="${colId}"]`);
            if (container) container.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.toggleDuplicates = () => {
            showOnlyDuplicates = !showOnlyDuplicates;
            const btn = document.getElementById('btnFilterDuplicates');
            if(showOnlyDuplicates) {
                btn.classList.replace('bg-red-50', 'bg-red-500');
                btn.classList.replace('text-red-600', 'text-white');
                btn.innerHTML = `<i class="fa-solid fa-filter"></i> Isolando Repetidos`;
            } else {
                btn.classList.replace('bg-red-500', 'bg-red-50');
                btn.classList.replace('text-white', 'text-red-600');
            }
            renderBoard();
        };

        // ==========================================
        // RENDERIZAÇÃO DO QUADRO
        // ==========================================
        function renderBoard() {
            if(columnsData.length === 0) return;

            const scrollPositions = {};
            document.querySelectorAll('.kanban-scroll-container').forEach(container => {
                scrollPositions[container.dataset.colId] = container.scrollTop;
            });

            // CÁLCULO DE DUPLICATAS GLOBAL
            const phoneCounts = {};
            leadsData.forEach(lead => {
                if(!lead.phone) return;
                const cleanPhone = lead.phone.replace(/\D/g, '');
                if(cleanPhone.length >= 10) phoneCounts[cleanPhone] = (phoneCounts[cleanPhone] || 0) + 1;
            });

            let duplicateCount = 0;
            leadsData.forEach(lead => {
                lead.isDuplicate = false;
                if(lead.phone) {
                    const cleanPhone = lead.phone.replace(/\D/g, '');
                    if(cleanPhone.length >= 10 && phoneCounts[cleanPhone] > 1) {
                        lead.isDuplicate = true;
                        duplicateCount++;
                    }
                }
            });

            const dupBtn = document.getElementById('btnFilterDuplicates');
            if(duplicateCount > 0) {
                dupBtn.classList.remove('hidden');
                dupBtn.classList.add('flex');
                if(!showOnlyDuplicates) dupBtn.innerHTML = `<i class="fa-solid fa-copy"></i> Duplicados (${duplicateCount})`;
            } else {
                dupBtn.classList.add('hidden');
                dupBtn.classList.remove('flex');
                showOnlyDuplicates = false;
            }

            boardEl.innerHTML = '';
            updateDashboard();
            
            const isFitMode = columnsData.length <= 8;
            const columnWidthClass = isFitMode ? 'flex-1 min-w-[200px] max-w-[400px]' : 'w-80 shrink-0';

            columnsData.forEach((col, index) => {
                const colEl = document.createElement('div');
                colEl.className = `kanban-col ${columnWidthClass} bg-slate-200/60 rounded-2xl flex flex-col border border-slate-200 h-[calc(100vh-270px)] transition-colors`;
                colEl.dataset.colId = col.id;
                
                colEl.draggable = true;
                colEl.addEventListener('dragstart', function(e) {
                    if (e.target === colEl) {
                        draggedColId = this.dataset.colId;
                        e.dataTransfer.effectAllowed = 'move';
                        setTimeout(() => this.classList.add('col-ghost'), 0);
                    }
                });
                colEl.addEventListener('dragend', function(e) { if (e.target === colEl) { this.classList.remove('col-ghost'); draggedColId = null; }});
                colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('bg-slate-300/40'); });
                colEl.addEventListener('dragleave', () => colEl.classList.remove('bg-slate-300/40'));
                colEl.addEventListener('drop', handleDrop);

                let colLeads = leadsData.filter(l => l.columnId === col.id);
                if(showOnlyDuplicates) colLeads = colLeads.filter(l => l.isDuplicate);

                const colorTheme = columnColors[index % columnColors.length];
                const isFechado = col.title.trim().toLowerCase() === 'fechado';
                const colTotalValue = colLeads.reduce((acc, l) => acc + (parseFloat(l.dealValue) || 0), 0);
                const colSubtitle = isFechado ? 'Faturamento Atual' : 'Faturamento Possível';
                const colSubtitleColor = isFechado ? 'text-blue-500' : 'text-green-600';

                colEl.innerHTML = `
                    <div class="p-4 pb-2 border-b border-slate-200/50">
                        <div class="flex justify-between items-center mb-2 group cursor-grab">
                            <i class="fa-solid fa-grip-vertical text-slate-300 mr-2 text-xs"></i>
                            <input type="text" class="font-bold text-slate-700 bg-transparent border-none focus:ring-2 focus:ring-blue-400 rounded px-1 w-full outline-none transition-colors cursor-text truncate" value="${col.title}" onblur="updateColumn('${col.id}', this.value)" onclick="event.stopPropagation()">
                            <button onclick="scrollToTop('${col.id}')" class="text-slate-300 hover:text-blue-500 transition px-1 ml-auto" title="Subir ao topo">
                                <i class="fa-solid fa-arrow-up text-[10px]"></i>
                            </button>
                            <span class="bg-white shadow-sm ${colorTheme.text} text-xs py-0.5 px-2 rounded-full font-bold ml-2 border border-slate-200 shrink-0">${colLeads.length}</span>
                        </div>
                        <div class="text-center bg-white/50 rounded-lg p-2 border border-white/60 shadow-sm mt-2">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${colSubtitle}</p>
                            <p class="text-sm font-black ${colSubtitleColor}">${formatMoney(colTotalValue)}</p>
                        </div>
                    </div>
                `;

                const container = document.createElement('div');
                container.className = 'flex-1 overflow-y-auto custom-scrollbar space-y-3 p-3 kanban-scroll-container relative';
                container.dataset.colId = col.id;
                
                colLeads.forEach(lead => container.appendChild(createCard(lead, col.title)));
                if(colLeads.length === 0) container.innerHTML = `<div class="h-20 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center text-slate-400 text-sm">Vazio</div>`;
                
                colEl.appendChild(container);
                boardEl.appendChild(colEl);
            });

            document.querySelectorAll('.kanban-scroll-container').forEach(container => {
                if (scrollPositions[container.dataset.colId] !== undefined) container.scrollTop = scrollPositions[container.dataset.colId];
            });

            const addColBtn = document.createElement('div');
            addColBtn.className = 'shrink-0';
            addColBtn.innerHTML = `<button onclick="addNewColumn()" class="bg-white border-2 border-dashed border-slate-300 text-slate-500 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50 transition rounded-xl w-14 h-full min-h-[100px] flex items-center justify-center shadow-sm"><i class="fa-solid fa-plus text-xl"></i></button>`;
            boardEl.appendChild(addColBtn);
            
            applySearchHighlight(true);
        }

        // ==========================================
        // GERAÇÃO DO CARTÃO
        // ==========================================
        function createCard(lead, columnTitle) {
            const isExpanded = expandedLeads.has(lead.id);
            const isFechado = columnTitle.trim().toLowerCase() === 'fechado';
            const valueColorClass = isFechado ? 'text-blue-600' : 'text-green-600';
            const valueBgClass = isFechado ? 'bg-blue-50 border-blue-100 focus-within:border-blue-300' : 'bg-green-50 border-green-100 focus-within:border-green-300';

            const card = document.createElement('div');
            card.className = `bg-white rounded-xl p-4 shadow-sm border ${isExpanded ? 'border-blue-400 ring-1 ring-blue-100' : 'border-slate-200'} cursor-grab hover:shadow-md transition-all group relative ${lead.isDuplicate ? 'ring-2 ring-red-300' : ''}`;
            card.draggable = true;
            card.dataset.leadId = lead.id;

            card.addEventListener('dragstart', function(e) {
                e.stopPropagation(); 
                draggedLeadId = this.dataset.leadId;
                setTimeout(() => this.classList.add('card-ghost'), 0);
            });
            card.addEventListener('dragend', function(e) {
                e.stopPropagation();
                this.classList.remove('card-ghost'); draggedLeadId = null; 
            });

            const formatDate = (ts) => ts ? new Date(ts).toLocaleDateString('pt-BR') : '-';
            const formatTime = (ts) => ts ? new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '-';

            const duplicateBadge = lead.isDuplicate 
                ? `<div class="flex justify-between items-center mb-1"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Contato</span><span class="bg-red-100 text-red-600 border border-red-200 text-[8px] font-bold px-1.5 py-0.5 rounded uppercase flex items-center gap-1 animate-pulse" title="Este número está noutro cartão também"><i class="fa-solid fa-triangle-exclamation"></i> Repetido</span></div>` 
                : `<div class="hidden"></div>`;

            card.innerHTML = `
                <div class="flex items-start justify-between mb-3">
                    <div class="flex items-center gap-2 w-[80%]">
                        <i class="fa-solid fa-grip-vertical text-slate-300"></i>
                        <input type="text" class="font-bold text-slate-800 bg-transparent w-full focus:outline-none focus:bg-slate-50 px-1 rounded edit-name truncate" value="${lead.name}">
                    </div>
                    <button class="text-slate-400 hover:text-blue-600 transition toggle-expand bg-slate-50 rounded-full w-7 h-7 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-list'}"></i>
                    </button>
                </div>

                <div class="space-y-2 mb-3">
                    <div>
                        ${duplicateBadge}
                        <div class="flex items-center bg-slate-50 rounded px-2 py-1 border border-transparent focus-within:border-slate-300 ${lead.isDuplicate ? 'border-red-200 bg-red-50/50' : ''}">
                            <i class="fa-solid fa-phone text-xs ${lead.isDuplicate ? 'text-red-400' : 'text-slate-400'} mr-2 phone-icon"></i>
                            <input type="text" class="bg-transparent w-full focus:outline-none edit-phone text-sm ${lead.isDuplicate ? 'text-red-700 font-bold' : 'text-slate-600'}" value="${lead.phone || ''}" placeholder="Celular/Fixo...">
                        </div>
                    </div>
                    
                    <div class="flex items-center bg-slate-50 rounded px-2 py-1 border border-transparent focus-within:border-slate-300">
                        <i class="fa-solid fa-location-dot text-xs text-slate-400 mr-2"></i>
                        <input type="text" class="w-full text-xs text-slate-500 bg-transparent focus:outline-none edit-address" value="${lead.address || ''}" placeholder="Endereço...">
                        <button class="text-slate-400 hover:text-blue-500 transition ml-1 px-1 map-btn" title="Abrir no Google Maps"><i class="fa-solid fa-map-location-dot"></i></button>
                    </div>

                    <div class="flex items-center rounded px-2 py-1 border transition-colors ${valueBgClass}">
                        <span class="text-[10px] font-bold text-slate-400 uppercase mr-2">Valor:</span>
                        <input type="text" class="edit-deal-value bg-transparent w-full focus:outline-none text-sm font-black ${valueColorClass} text-right" value="${formatMoney(lead.dealValue)}" title="Edite o valor deste negócio">
                    </div>
                </div>

                <div class="${isExpanded ? 'block' : 'hidden'} mt-4 pt-4 border-t border-slate-100">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Histórico</p>
                        <button class="text-red-400 hover:text-red-600 text-[10px] uppercase font-bold delete-btn"><i class="fa-regular fa-trash-can"></i> Excluir Cartão</button>
                    </div>
                    <div class="max-h-40 overflow-y-auto custom-scrollbar mb-3 space-y-3">
                        ${(lead.history || []).length > 0 ? lead.history.map((h, idx) => `
                            <div class="history-item text-xs">
                                <textarea class="w-full bg-slate-50 border-none focus:ring-0 p-1 rounded edit-history-item resize-none min-h-[40px]" data-index="${idx}">${h.text}</textarea>
                                <div class="flex justify-between text-[9px] text-slate-400 mt-1 italic px-1">
                                    <span>${formatDate(h.createdAt)} ${formatTime(h.createdAt)}</span>
                                    ${h.updatedAt ? `<span>Edit: ${formatDate(h.updatedAt)}</span>` : ''}
                                </div>
                            </div>
                        `).join('') : '<p class="text-xs text-slate-400 italic">Sem notas.</p>'}
                    </div>
                    <div class="flex gap-2">
                        <input type="text" class="flex-1 text-xs border border-slate-200 rounded p-2 focus:ring-1 focus:ring-blue-500 outline-none new-note-input" placeholder="Nova nota...">
                        <button class="bg-slate-800 text-white px-3 py-1 rounded text-xs add-note-btn"><i class="fa-solid fa-check"></i></button>
                    </div>
                </div>

                <button class="mt-3 w-full ${lead.phone ? 'bg-[#25D366] hover:bg-[#1da851] text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} py-2 rounded-lg font-medium flex items-center justify-center gap-2 whatsapp-btn text-sm transition-colors">
                    <i class="fa-brands fa-whatsapp"></i> Conversar
                </button>
            `;

            const dealInput = card.querySelector('.edit-deal-value');
            dealInput.addEventListener('input', (e) => {
                let val = e.target.value.replace(/\D/g, '');
                if(!val) val = '0';
                e.target.value = formatMoney(parseFloat(val) / 100);
            });
            dealInput.addEventListener('blur', (e) => {
                let val = e.target.value.replace(/\D/g, '');
                let raw = val ? parseFloat(val) / 100 : 0;
                updateField(lead.id, 'dealValue', raw);
            });

            card.querySelector('.toggle-expand').onclick = () => { isExpanded ? expandedLeads.delete(lead.id) : expandedLeads.add(lead.id); renderBoard(); };
            card.querySelector('.edit-name').onblur = (e) => updateField(lead.id, 'name', e.target.value);
            card.querySelector('.edit-address').onblur = (e) => updateField(lead.id, 'address', e.target.value);
            card.querySelector('.map-btn').onclick = () => {
                const addr = card.querySelector('.edit-address').value.trim();
                if(addr) window.open(`http://googleusercontent.com/maps.google.com/4{encodeURIComponent(addr)}`, '_blank');
                else alert('Por favor, preencha o endereço.');
            };

            const phoneInput = card.querySelector('.edit-phone');
            const phoneIcon = card.querySelector('.phone-icon');
            
            phoneInput.addEventListener('input', function(e) { e.target.value = mascaraTelefoneInteligente(e.target.value); });
            phoneInput.onblur = (e) => { updateField(lead.id, 'phone', e.target.value); };
            
            phoneInput.addEventListener('paste', async (e) => {
                const item = Array.from(e.clipboardData.items).find(i => i.type.includes('image'));
                if (item) {
                    e.preventDefault();
                    phoneIcon.className = "fa-solid fa-circle-notch fa-spin text-xs text-blue-500 mr-2";
                    try {
                        const res = await Tesseract.recognize(item.getAsFile(), 'por');
                        const phoneMatch = res.data.text.match(/(?:\(?\d{2}\)?\s?)?(?:9?\d{4})[-\s]?(?:\d{4})/);
                        if(phoneMatch) {
                            let formatted = mascaraTelefoneInteligente(phoneMatch[0]);
                            phoneInput.value = formatted;
                            await updateField(lead.id, 'phone', formatted);
                        }
                    } catch(err) {} finally { phoneIcon.className = "fa-solid fa-phone text-xs text-slate-400 mr-2"; }
                }
            });

            card.querySelector('.whatsapp-btn').onclick = () => {
                if(!lead.phone) return;
                let num = lead.phone.replace(/\D/g, '');
                if (num.length >= 10 && !num.startsWith('55')) num = '55' + num;
                window.open(`https://api.whatsapp.com/send?phone=${num}`, '_blank');
            };
            
            card.querySelector('.delete-btn').onclick = () => confirm('Excluir Cartão permanentemente?') && db.collection('leads').doc(lead.id).delete();
            
            const addNoteBtn = card.querySelector('.add-note-btn');
            if(addNoteBtn) {
                addNoteBtn.onclick = async () => {
                    const val = card.querySelector('.new-note-input').value;
                    if(!val.trim()) return;
                    const newHistory = lead.history || [];
                    newHistory.push({ text: val, createdAt: Date.now(), updatedAt: null });
                    await updateField(lead.id, 'history', newHistory);
                };
            }
            card.querySelectorAll('.edit-history-item').forEach(area => {
                area.onblur = async (e) => {
                    const idx = e.target.dataset.index;
                    const newHistory = [...lead.history];
                    if(newHistory[idx].text === e.target.value) return;
                    newHistory[idx].text = e.target.value;
                    newHistory[idx].updatedAt = Date.now();
                    await updateField(lead.id, 'history', newHistory);
                };
            });

            return card;
        }

        // ==========================================
        // UTILITÁRIOS E INTEGRAÇÕES
        // ==========================================
        async function updateField(id, field, val) { await db.collection('leads').doc(id).update({ [field]: val }); }
        function handleDrop(e) {
            e.preventDefault(); e.stopPropagation();
            this.classList.remove('bg-slate-300/40');
            const targetColId = this.dataset.colId;
            if (draggedLeadId) updateField(draggedLeadId, 'columnId', targetColId);
            else if (draggedColId && draggedColId !== targetColId) reorderColumns(draggedColId, targetColId);
        }
        async function reorderColumns(sourceId, targetId) {
            const newCols = [...columnsData];
            const srcIdx = newCols.findIndex(c => c.id === sourceId);
            const tgtIdx = newCols.findIndex(c => c.id === targetId);
            const [movedCol] = newCols.splice(srcIdx, 1);
            newCols.splice(tgtIdx, 0, movedCol);
            const batch = db.batch();
            newCols.forEach((col, idx) => { batch.update(db.collection('columns').doc(col.id), { order: idx + 1 }); });
            await batch.commit();
        }

        function updateDashboard() {
            const totalLeads = leadsData.length;
            document.getElementById('dashTotalLeads').innerText = totalLeads;
            const metricsContainer = document.getElementById('dashMetrics');
            const progressContainer = document.getElementById('dashProgressBar');
            metricsContainer.innerHTML = ''; progressContainer.innerHTML = '';
            if (totalLeads === 0) return;

            columnsData.forEach((col, index) => {
                const count = leadsData.filter(l => l.columnId === col.id).length;
                const percentage = totalLeads > 0 ? Math.round((count / totalLeads) * 100) : 0;
                const colorTheme = columnColors[index % columnColors.length];
                metricsContainer.innerHTML += `<div class="flex flex-col bg-white border border-slate-200 rounded-lg px-3 py-1.5 shadow-sm shrink-0 min-w-[90px]"><div class="flex items-center gap-1.5 mb-1"><span class="w-2 h-2 rounded-full ${colorTheme.bg}"></span><span class="text-[9px] font-bold text-slate-500 uppercase truncate max-w-[80px]">${col.title}</span></div><div class="flex items-baseline justify-between gap-3"><span class="text-xl font-black text-slate-800 leading-none">${count}</span><span class="text-[9px] font-bold ${colorTheme.text} ${colorTheme.lightBg} px-1.5 py-0.5 rounded-md">${percentage}%</span></div></div>`;
                if (count > 0) progressContainer.innerHTML += `<div class="${colorTheme.bg} h-full transition-all duration-500" style="width: ${percentage}%"></div>`;
            });
        }

        // ==========================================
        // MOTOR DE PESQUISA
        // ==========================================
        searchInput.addEventListener('input', (e) => { 
            currentSearchTerm = e.target.value.toLowerCase().trim(); 
            applySearchHighlight(); 
        });

        function applySearchHighlight(isReRender = false) { 
            searchMatches = [];
            
            document.querySelectorAll('.edit-name').forEach(input => { 
                input.classList.remove('highlight-match', 'active-search-match'); 
                input.classList.add('text-slate-800', 'bg-transparent'); 
                
                if (currentSearchTerm && input.value.toLowerCase().includes(currentSearchTerm)) { 
                    input.classList.add('highlight-match'); 
                    input.classList.remove('text-slate-800', 'bg-transparent'); 
                    searchMatches.push(input);
                } 
            });

            if (searchMatches.length > 0) {
                searchControls.classList.remove('hidden');
                searchControls.classList.add('flex');
                
                if(!isReRender || currentSearchIndex === -1 || currentSearchIndex >= searchMatches.length) {
                    currentSearchIndex = 0;
                }
                focusSearchMatch(currentSearchIndex);
            } else {
                if (currentSearchTerm) {
                    searchControls.classList.remove('hidden');
                    searchControls.classList.add('flex');
                    searchCounter.innerText = "0/0";
                } else {
                    searchControls.classList.add('hidden');
                    searchControls.classList.remove('flex');
                    currentSearchIndex = -1;
                }
            }
        }

        function focusSearchMatch(index) {
            if (searchMatches.length === 0) return;
            if (index < 0) index = searchMatches.length - 1;
            if (index >= searchMatches.length) index = 0;
            
            currentSearchIndex = index;
            searchCounter.innerText = `${currentSearchIndex + 1}/${searchMatches.length}`;
            
            searchMatches.forEach(el => el.classList.remove('active-search-match'));
            
            const activeEl = searchMatches[currentSearchIndex];
            activeEl.classList.add('active-search-match');
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        window.prevSearch = () => focusSearchMatch(currentSearchIndex - 1);
        window.nextSearch = () => focusSearchMatch(currentSearchIndex + 1);

        // ==========================================
        // EXTRAÇÃO INTELIGENTE DE PRINT (GOOGLE MAPS)
        // ==========================================
        const manualPhoneInput = document.getElementById('manualPhone');
        const manualAddressInput = document.getElementById('manualAddress');
        const manualNameInput = document.getElementById('manualName');

        manualPhoneInput.addEventListener('input', function(e) {
            e.target.value = mascaraTelefoneInteligente(e.target.value);
        });

        document.getElementById('manualForm').onsubmit = (e) => {
            e.preventDefault();
            db.collection('leads').add({ 
                name: manualNameInput.value, 
                phone: manualPhoneInput.value, 
                address: manualAddressInput.value, // Agora salva o endereço
                dealValue: 0, 
                columnId: columnsData[0].id, 
                createdAt: Date.now(), 
                history: [] 
            });
            manualNameInput.value = ''; 
            manualPhoneInput.value = '';
            manualAddressInput.value = '';
        };

        const pasteInitial = document.getElementById('pasteInitialState');
        const pasteProcessing = document.getElementById('pasteProcessingState');
        
        document.getElementById('pasteZone').onpaste = async (e) => {
            const item = Array.from(e.clipboardData.items).find(i => i.type.includes('image'));
            if (item) {
                pasteInitial.classList.add('hidden'); 
                pasteProcessing.classList.remove('hidden'); 
                pasteProcessing.classList.add('flex');
                
                try {
                    const res = await Tesseract.recognize(item.getAsFile(), 'por');
                    const text = res.data.text;
                    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);
                    
                    // 1. Nome: primeira linha
                    let name = lines[0] || 'Novo Lead do Maps';

                    // 2. Extrair Telefones e Priorizar Celular
                    let finalPhone = '';
                    const phoneRegex = /(?:\+55\s?)?(?:\(?\d{2}\)?\s?)?\d{4,5}[-\s]?\d{4}/g;
                    const allPhones = text.match(phoneRegex);

                    if (allPhones && allPhones.length > 0) {
                        let celulares = allPhones.filter(p => {
                            let limpo = p.replace(/\D/g, '');
                            return limpo.length >= 10 && limpo.replace(/^55/, '').length === 11 && limpo.replace(/^55/, '')[2] === '9';
                        });
                        // Prefere celular. Se não, usa o primeiro que achou (fixo)
                        let escolhido = celulares.length > 0 ? celulares[0] : allPhones[0];
                        finalPhone = mascaraTelefoneInteligente(escolhido);
                    }
                    
                    // 3. Extrair Endereço do Maps
                    let addr = lines.find(l => 
                        l.match(/(rua|av|avenida|praça|rodovia|bairro|centro)/i) || 
                        l.match(/,\s*\d+/) || // Tem vírgula seguida de número
                        l.match(/\d{5}-\d{3}/) // Tem CEP
                    ) || '';

                    await db.collection('leads').add({ 
                        name: name, 
                        phone: finalPhone, 
                        address: addr, 
                        dealValue: 0, 
                        columnId: columnsData[0].id, 
                        createdAt: Date.now(), 
                        history: [{ text: "Criado via Print do Google Maps.", createdAt: Date.now() }] 
                    });
                } catch(err) {
                    alert("Ocorreu um erro ao extrair os dados da imagem.");
                } finally { 
                    pasteInitial.classList.remove('hidden'); 
                    pasteProcessing.classList.add('hidden'); 
                }
            }
        };
    </script>
