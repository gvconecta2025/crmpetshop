<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pet Shops - Pro Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .kanban-col { min-width: 320px; }
        .card-ghost { opacity: 0.5; background-color: #e2e8f0; }
        .history-item { border-left: 2px solid #e2e8f0; padding-left: 10px; margin-bottom: 10px; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div class="p-6 pb-2 shrink-0">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800 mb-4"><i class="fa-solid fa-paw mr-2 text-blue-600"></i>CRM Pet Shops <span class="text-xs font-normal bg-blue-100 text-blue-600 px-2 py-1 rounded ml-2">v2.0 - Histórico Ativo</span></h1>
            
            <div class="flex flex-col md:flex-row gap-6">
                <div id="pasteZone" class="flex-1 border-2 border-dashed border-slate-300 bg-slate-50 rounded-xl p-8 flex flex-col items-center justify-center transition-all cursor-text outline-none hover:border-blue-400 focus:border-blue-500 focus:bg-white" tabindex="0">
                    <div id="pasteInitialState" class="flex flex-col items-center">
                        <div class="bg-white p-3 rounded-full shadow-sm mb-3">
                            <i class="fa-regular fa-image text-2xl text-slate-400"></i>
                        </div>
                        <p class="text-slate-700 font-semibold text-lg">Área de Captura Rápida</p>
                        <p class="text-slate-500 mt-1 text-center text-sm">Clique aqui e faça <kbd class="bg-slate-200 px-2 py-1 rounded font-mono text-xs">Ctrl + V</kbd></p>
                    </div>
                    
                    <div id="pasteProcessingState" class="hidden flex-col items-center">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
                        <p class="text-blue-700 font-medium">A extrair dados da imagem... ⏳</p>
                    </div>
                </div>

                <div class="w-full md:w-1/3 flex flex-col justify-center">
                    <form id="manualForm" class="flex gap-2">
                        <input type="text" id="manualName" placeholder="Nome do Pet Shop..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                        <button type="submit" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition" title="Adicionar">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 overflow-x-auto p-6 pt-2">
        <div class="flex gap-6 h-full" id="kanbanBoard">
            </div>
    </div>

    <script>
        // 1. CONFIGURAÇÃO FIREBASE (SUAS CHAVES)
        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. ESTADO
        const columns = [
            { id: 'col-1', title: 'Novos Leads' },
            { id: 'col-2', title: 'Em Contato' },
            { id: 'col-3', title: 'Apresentação' },
            { id: 'col-4', title: 'Fechado' }
        ];
        
        let leadsData = [];
        let draggedLeadId = null;
        let expandedLeads = new Set(); // Guarda quais cards estão abertos

        const boardEl = document.getElementById('kanbanBoard');
        const pasteZone = document.getElementById('pasteZone');
        const pasteInitial = document.getElementById('pasteInitialState');
        const pasteProcessing = document.getElementById('pasteProcessingState');
        const manualForm = document.getElementById('manualForm');

        // 3. LISTENERS
        db.collection('leads').onSnapshot((snapshot) => {
            leadsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            leadsData.sort((a, b) => b.createdAt - a.createdAt);
            renderBoard();
        });

        function renderBoard() {
            boardEl.innerHTML = '';
            columns.forEach(col => {
                const colEl = document.createElement('div');
                colEl.className = 'kanban-col w-80 bg-slate-200/60 rounded-2xl p-4 flex flex-col border border-slate-200 h-full overflow-hidden shrink-0';
                colEl.dataset.colId = col.id;
                colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('bg-slate-300/40'); });
                colEl.addEventListener('dragleave', () => colEl.classList.remove('bg-slate-300/40'));
                colEl.addEventListener('drop', handleDrop);

                const colLeads = leadsData.filter(l => l.columnId === col.id);
                colEl.innerHTML = `
                    <div class="flex justify-between items-center mb-4 px-1">
                        <h2 class="font-bold text-slate-700">${col.title}</h2>
                        <span class="bg-slate-300 text-slate-600 text-xs py-0.5 px-2 rounded-full font-medium">${colLeads.length}</span>
                    </div>
                `;

                const container = document.createElement('div');
                container.className = 'flex-1 overflow-y-auto custom-scrollbar space-y-3 pb-2 pr-1';
                colLeads.forEach(lead => container.appendChild(createCard(lead)));
                
                colEl.appendChild(container);
                boardEl.appendChild(colEl);
            });
        }

        function createCard(lead) {
            const isExpanded = expandedLeads.has(lead.id);
            const card = document.createElement('div');
            card.className = `bg-white rounded-xl p-4 shadow-sm border ${isExpanded ? 'border-blue-400 ring-1 ring-blue-100' : 'border-slate-200'} cursor-grab hover:shadow-md transition-all group`;
            card.draggable = true;
            card.dataset.leadId = lead.id;

            card.addEventListener('dragstart', function(e) {
                draggedLeadId = this.dataset.leadId;
                setTimeout(() => this.classList.add('card-ghost'), 0);
            });
            card.addEventListener('dragend', function() { this.classList.remove('card-ghost'); draggedLeadId = null; });

            // Formatação de Datas
            const formatDate = (ts) => ts ? new Date(ts).toLocaleDateString('pt-BR') : '-';
            const formatTime = (ts) => ts ? new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '-';

            card.innerHTML = `
                <div class="flex items-start justify-between mb-3">
                    <div class="flex items-center gap-2 w-[70%]">
                        <i class="fa-solid fa-grip-vertical text-slate-300"></i>
                        <input type="text" class="font-bold text-slate-800 bg-transparent w-full focus:outline-none focus:bg-slate-50 px-1 rounded edit-name" value="${lead.name}">
                    </div>
                    <div class="flex gap-2">
                        <button class="text-slate-400 hover:text-blue-600 transition toggle-expand" title="Ver Histórico">
                            <i class="fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-clock-rotate-left'}"></i>
                        </button>
                        <button class="text-slate-300 hover:text-red-500 delete-btn"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>

                <div class="space-y-2 mb-3">
                    <div class="flex items-center text-sm text-slate-600"><i class="fa-solid fa-phone w-5 text-slate-400"></i>
                        <input type="text" class="bg-transparent w-full focus:outline-none edit-phone" value="${lead.phone || ''}" placeholder="Telefone">
                    </div>
                    <div class="flex items-center text-xs text-slate-500"><i class="fa-solid fa-location-dot w-5 text-slate-400"></i>
                        <input type="text" class="bg-transparent w-full focus:outline-none edit-address" value="${lead.address || ''}" placeholder="Endereço">
                    </div>
                </div>

                <div class="${isExpanded ? 'block' : 'hidden'} mt-4 pt-4 border-t border-slate-100">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-wider">Histórico de Observações</p>
                    
                    <div class="max-h-40 overflow-y-auto custom-scrollbar mb-3 space-y-3">
                        ${(lead.history || []).length > 0 ? lead.history.map((h, index) => `
                            <div class="history-item text-xs">
                                <textarea class="w-full bg-slate-50 border-none focus:ring-0 p-1 rounded edit-history-item" data-index="${index}">${h.text}</textarea>
                                <div class="flex justify-between text-[9px] text-slate-400 mt-1 italic">
                                    <span>Criado: ${formatDate(h.createdAt)} ${formatTime(h.createdAt)}</span>
                                    ${h.updatedAt ? `<span>Editado: ${formatDate(h.updatedAt)}</span>` : ''}
                                </div>
                            </div>
                        `).join('') : '<p class="text-xs text-slate-400 italic">Sem observações ainda.</p>'}
                    </div>

                    <div class="flex gap-2">
                        <input type="text" class="flex-1 text-xs border border-slate-200 rounded p-2 focus:ring-1 focus:ring-blue-500 outline-none new-note-input" placeholder="Nova nota...">
                        <button class="bg-slate-800 text-white px-3 py-1 rounded text-xs hover:bg-slate-900 add-note-btn"><i class="fa-solid fa-check"></i></button>
                    </div>
                </div>

                <button class="mt-3 w-full ${lead.phone ? 'bg-[#25D366]' : 'bg-slate-200 text-slate-400'} py-2 rounded-lg font-medium flex items-center justify-center gap-2 whatsapp-btn text-sm">
                    <i class="fa-brands fa-whatsapp"></i> Conversar
                </button>
            `;

            // EVENTOS DO CARD
            card.querySelector('.toggle-expand').onclick = () => {
                if (isExpanded) expandedLeads.delete(lead.id);
                else expandedLeads.add(lead.id);
                renderBoard();
            };

            card.querySelector('.edit-name').onblur = (e) => updateField(lead.id, 'name', e.target.value);
            card.querySelector('.edit-phone').onblur = (e) => updateField(lead.id, 'phone', e.target.value);
            card.querySelector('.edit-address').onblur = (e) => updateField(lead.id, 'address', e.target.value);
            
            // Adicionar Nota ao Histórico
            const addNoteBtn = card.querySelector('.add-note-btn');
            const newNoteInput = card.querySelector('.new-note-input');
            if(addNoteBtn) {
                addNoteBtn.onclick = async () => {
                    if(!newNoteInput.value.trim()) return;
                    const newHistory = lead.history || [];
                    newHistory.push({
                        text: newNoteInput.value,
                        createdAt: Date.now(),
                        updatedAt: null
                    });
                    await updateField(lead.id, 'history', newHistory);
                };
            }

            // Editar Nota Existente
            card.querySelectorAll('.edit-history-item').forEach(area => {
                area.onblur = async (e) => {
                    const idx = e.target.dataset.index;
                    const newHistory = [...lead.history];
                    if(newHistory[idx].text === e.target.value) return;
                    newHistory[idx].text = e.target.value;
                    newHistory[idx].updatedAt = Date.now();
                    await updateField(lead.id, 'history', newHistory);
                };
            });

            card.querySelector('.delete-btn').onclick = () => confirm('Excluir lead?') && db.collection('leads').doc(lead.id).delete();
            
            card.querySelector('.whatsapp-btn').onclick = () => {
                if(!lead.phone) return;
                let num = lead.phone.replace(/\D/g, '');
                if (num.length >= 10 && !num.startsWith('55')) num = '55' + num;
                window.open(`https://api.whatsapp.com/send?phone=${num}`, '_blank');
            };

            return card;
        }

        // 4. FUNÇÕES FIREBASE
        async function updateField(id, field, val) { await db.collection('leads').doc(id).update({ [field]: val }); }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('bg-slate-300/40');
            const colId = this.dataset.colId;
            if (draggedLeadId) updateField(draggedLeadId, 'columnId', colId);
        }

        // 5. CAPTURA E OCR
        manualForm.onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('manualName');
            db.collection('leads').add({ name: input.value, columnId: 'col-1', createdAt: Date.now(), history: [] });
            input.value = '';
        };

        pasteZone.onpaste = async (e) => {
            const item = Array.from(e.clipboardData.items).find(i => i.type.includes('image'));
            if (item) {
                pasteInitial.classList.add('hidden');
                pasteProcessing.classList.remove('hidden');
                try {
                    const res = await Tesseract.recognize(item.getAsFile(), 'por');
                    const text = res.data.text;
                    const lines = text.split('\n').filter(l => l.trim().length > 2);
                    
                    let name = lines[0]?.toLowerCase().includes('pet') ? lines[1] : lines[0];
                    let phone = text.match(/(?:\(\d{2}\)\s?)?\d{4,5}-\d{4}/)?.[0] || '';
                    let addr = lines.find(l => l.match(/rua|av|praça|centro/i)) || '';

                    await db.collection('leads').add({
                        name: name || 'Novo Lead',
                        phone: phone,
                        address: addr,
                        columnId: 'col-1',
                        createdAt: Date.now(),
                        history: [{ text: "Lead capturado via imagem.", createdAt: Date.now(), updatedAt: null }]
                    });
                } finally {
                    pasteInitial.classList.remove('hidden');
                    pasteProcessing.classList.add('hidden');
                }
            }
        };
    </script>
</body>
</html>
