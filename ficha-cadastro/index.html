<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM PetLojas - Diretório e Ficha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .salvo-sucesso { background-color: #d1fae5; transition: background-color 0.5s ease; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden font-sans text-gray-800">

    <nav class="w-20 bg-slate-900 flex flex-col items-center py-6 space-y-8 text-slate-400 border-r border-slate-800 shrink-0 z-20">
        <div class="text-emerald-400 text-2xl font-bold mb-4"><i class="fa-solid fa-paw"></i></div>
        <a href="../index.html" class="hover:text-white transition" title="Voltar ao Kanban"><i class="fa-solid fa-table-columns text-xl"></i></a>
        <a href="index.html" class="text-white bg-slate-800 p-3 rounded-lg transition" title="Diretório de Contatos"><i class="fa-solid fa-address-card text-xl"></i></a>
        <a href="#" class="hover:text-white transition" title="Agenda"><i class="fa-regular fa-calendar-check text-xl"></i></a>
        <div class="flex-grow"></div>
        <img src="https://ui-avatars.com/api/?name=PetLojas&background=10b981&color=fff" class="w-10 h-10 rounded-full border-2 border-slate-700" alt="Avatar">
    </nav>

    <div id="view-lista" class="hidden flex-1 flex-col bg-slate-50 overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-8 py-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Diretório de Leads</h1>
                <p class="text-sm text-gray-500 mt-1" id="contador-contatos">Carregando contatos...</p>
            </div>
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="input-pesquisa" placeholder="Pesquisar por nome ou telefone..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-80 text-sm">
            </div>
        </header>
        
        <main class="flex-1 p-8 overflow-y-auto no-scrollbar">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 text-xs font-bold text-gray-500 uppercase">
                        <tr>
                            <th class="px-6 py-4 text-left">Nome do Lead (Card)</th>
                            <th class="px-6 py-4 text-left">Telefone / WhatsApp</th>
                            <th class="px-6 py-4 text-left">Fase (Coluna)</th>
                            <th class="px-6 py-4 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-contatos" class="bg-white divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="view-detalhes" class="hidden flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-white border-r border-gray-200 flex flex-col shrink-0 no-scrollbar overflow-y-auto relative">
            <div id="aviso-salvo" class="absolute top-2 left-1/2 transform -translate-x-1/2 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded shadow-lg opacity-0 transition-opacity pointer-events-none z-50">Salvo!</div>

            <div class="p-6 border-b border-gray-100">
                <button onclick="window.location.href='index.html'" class="text-gray-400 hover:text-gray-600 mb-6 text-sm font-medium transition flex items-center">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Voltar à Lista
                </button>
                
                <div id="iniciais-cliente" class="flex items-center justify-center w-20 h-20 bg-blue-100 text-blue-600 rounded-full text-2xl font-bold mb-4 mx-auto uppercase pointer-events-none">..</div>
                
                <h2 id="nome-empresa" contenteditable="true" title="Clique para editar" class="text-xl font-bold text-center text-gray-900 leading-tight outline-none focus:bg-gray-50 focus:ring-2 focus:ring-blue-200 rounded p-1 transition cursor-text border border-transparent hover:border-gray-200">Carregando...</h2>
                
                <div class="flex justify-center mt-3 mb-6 pointer-events-none">
                    <span id="tag-coluna" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full transition-all">Fase</span>
                </div>

                <button id="btn-whatsapp" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-emerald-100 transition flex items-center justify-center gap-2 mb-8">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Chamar WhatsApp
                </button>

                <div class="space-y-5 text-sm">
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Contato <i class="fa-solid fa-pen text-[9px] ml-1"></i></p>
                        <p id="nome-contato" contenteditable="true" class="font-medium text-gray-800 outline-none focus:bg-gray-50 focus:ring-2 focus:ring-blue-200 rounded p-1 -ml-1 transition cursor-text border border-transparent hover:border-gray-200">...</p>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Telefone Principal <i class="fa-solid fa-pen text-[9px] ml-1"></i></p>
                        <p id="telefone-cliente" contenteditable="true" class="font-medium text-gray-800 outline-none focus:bg-gray-50 focus:ring-2 focus:ring-blue-200 rounded p-1 -ml-1 transition cursor-text border border-transparent hover:border-gray-200">...</p>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Localização <i class="fa-solid fa-pen text-[9px] ml-1"></i></p>
                        <p id="endereco-cliente" contenteditable="true" class="font-medium text-gray-800 text-xs outline-none focus:bg-gray-50 focus:ring-2 focus:ring-blue-200 rounded p-1 -ml-1 transition cursor-text border border-transparent hover:border-gray-200">...</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-slate-50 flex flex-col relative">
            <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10">
                <h3 class="text-lg font-bold text-gray-800">Linha do Tempo</h3>
            </header>
            <div class="flex-1 p-6 overflow-y-auto no-scrollbar">
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-8">
                    <textarea id="texto-anotacao" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition resize-none" rows="3" placeholder="O que aconteceu nesta conversa?"></textarea>
                    <div class="flex justify-end mt-3">
                        <button id="btn-salvar-nota" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-bold transition">Registrar Atividade</button>
                    </div>
                </div>
                <div id="container-historico" class="relative border-l-2 border-gray-200 ml-4 space-y-8 pb-10">
                    </div>
            </div>
        </main>

        <aside class="w-80 bg-white border-l border-gray-200 flex flex-col shrink-0">
            <header class="p-6 border-b border-gray-100 bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-check text-blue-600"></i> Agendamentos
                </h3>
            </header>
            <div class="p-6">
                <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl mb-4">
                    <input type="text" placeholder="Tarefa (ex: Retornar amanhã)" class="w-full mb-3 text-sm p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                    <div class="flex gap-2 mb-3">
                        <input type="date" class="w-full text-xs p-2 rounded border border-gray-300">
                        <input type="time" class="w-full text-xs p-2 rounded border border-gray-300">
                    </div>
                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 rounded transition shadow-md">Agendar</button>
                </div>
            </div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db; // Exportando para o escopo global apenas para debug
            
            let todosOsLeads = [];
            let unsubscribeLista = null;
            let unsubscribeFicha = null;
            let leadAtualId = null;

            function init() {
                const parametros = new URLSearchParams(window.location.search);
                const leadId = parametros.get('id');

                if (leadId) {
                    document.getElementById('view-lista').classList.add('hidden');
                    document.getElementById('view-detalhes').classList.remove('hidden');
                    carregarFichaEmTempoReal(leadId);
                } else {
                    document.getElementById('view-lista').classList.remove('hidden');
                    document.getElementById('view-detalhes').classList.add('hidden');
                    carregarListaGeralEmTempoReal();
                }
            }

            // FUNÇÕES DO DIRETÓRIO (TEMPO REAL)
            function carregarListaGeralEmTempoReal() {
                if(unsubscribeLista) unsubscribeLista();
                unsubscribeLista = onSnapshot(collection(db, "leads"), (querySnapshot) => {
                    todosOsLeads = [];
                    querySnapshot.forEach(doc => { todosOsLeads.push({ id: doc.id, ...doc.data() }); });
                    
                    document.getElementById('contador-contatos').innerText = `${todosOsLeads.length} prospectos na base.`;
                    
                    const termo = document.getElementById('input-pesquisa').value.toLowerCase();
                    aplicarFiltro(termo);
                }, (error) => {
                    console.error("Erro no onSnapshot da Lista:", error);
                });

                document.getElementById('input-pesquisa').oninput = (e) => aplicarFiltro(e.target.value.toLowerCase());
            }

            function aplicarFiltro(termo) {
                const filtrados = todosOsLeads.filter(l => 
                    (l.titulo || "").toLowerCase().includes(termo) || 
                    (l.telefone || "").includes(termo)
                );
                renderizarLista(filtrados);
            }

            function renderizarLista(lista) {
                const tbody = document.getElementById('tabela-contatos');
                tbody.innerHTML = '';
                lista.forEach(lead => {
                    const nomeMostrado = lead.titulo || "Sem Nome"; 
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition border-b border-gray-100";
                    tr.innerHTML = `
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-xs uppercase">${nomeMostrado.substring(0,2)}</div>
                                <span class="text-sm font-bold text-gray-900">${nomeMostrado}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600">${lead.telefone || '-'}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-bold rounded uppercase">
                                ${lead.columnId || 'Sem Coluna'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <a href="?id=${lead.id}" class="text-xs bg-white border border-gray-200 px-3 py-1.5 rounded-lg font-bold shadow-sm hover:bg-slate-50 transition">Ver Ficha</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // FUNÇÕES DA FICHA E EDIÇÃO (TEMPO REAL)
            function carregarFichaEmTempoReal(id) {
                leadAtualId = id;
                if(unsubscribeFicha) unsubscribeFicha();

                const docRef = doc(db, "leads", id);

                unsubscribeFicha = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const d = docSnap.data();
                        const nomeFinal = d.titulo || "Lead sem Nome";
                        
                        if(document.activeElement.id !== "nome-empresa") {
                            document.getElementById("nome-empresa").innerText = nomeFinal;
                            document.getElementById("iniciais-cliente").innerText = nomeFinal.substring(0,2);
                        }
                        if(document.activeElement.id !== "nome-contato") {
                            document.getElementById("nome-contato").innerText = d.nomeContato || "Adicionar contato";
                        }
                        if(document.activeElement.id !== "telefone-cliente") {
                            document.getElementById("telefone-cliente").innerText = d.telefone || "Adicionar telefone";
                            atualizarBotaoWhatsApp(d.telefone, nomeFinal);
                        }
                        if(document.activeElement.id !== "endereco-cliente") {
                            document.getElementById("endereco-cliente").innerText = d.endereco || "Adicionar endereço";
                        }

                        document.getElementById("tag-coluna").innerText = d.columnId || "Lead";
                    }
                }, (error) => {
                    console.error("Erro no onSnapshot da Ficha:", error);
                });

                ativarEdicao("nome-empresa", "titulo");
                ativarEdicao("nome-contato", "nomeContato");
                ativarEdicao("telefone-cliente", "telefone");
                ativarEdicao("endereco-cliente", "endereco");

                document.getElementById("container-historico").innerHTML = `
                    <div class="relative pl-6">
                        <div class="absolute -left-2 top-0 w-4 h-4 rounded-full bg-blue-500 border-4 border-slate-50"></div>
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                            <p class="text-sm text-gray-700">Ficha carregada em Tempo Real.</p>
                            <span class="text-[10px] text-gray-400 uppercase font-bold mt-2 block">SISTEMA PETLOJAS</span>
                        </div>
                    </div>
                `;
            }

            function atualizarBotaoWhatsApp(telefone, nomeEmpresa) {
                const btn = document.getElementById("btn-whatsapp");
                const num = (telefone || "").replace(/\D/g, '');
                if(num) {
                    btn.onclick = () => {
                        const txt = encodeURIComponent(`Olá, pessoal da ${nomeEmpresa}! Aqui é da PetLojas. Tudo bem?`);
                        window.open(`https://wa.me/55${num}?text=${txt}`, '_blank');
                    };
                }
            }

            function ativarEdicao(elementoId, campoFirebase) {
                const el = document.getElementById(elementoId);
                const newEl = el.cloneNode(true);
                el.parentNode.replaceChild(newEl, el);
                
                newEl.addEventListener('blur', async (e) => {
                    const novoValor = e.target.innerText.trim();
                    if(novoValor === "Adicionar contato" || novoValor === "Adicionar telefone" || novoValor === "Adicionar endereço") return;

                    if(leadAtualId) {
                        try {
                            const docRef = doc(db, "leads", leadAtualId);
                            await updateDoc(docRef, { [campoFirebase]: novoValor });
                            mostrarAvisoSalvo(newEl);
                        } catch(err) {
                            console.error("Erro ao salvar edição:", err);
                        }
                    }
                });

                newEl.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter') {
                        e.preventDefault();
                        newEl.blur();
                    }
                });
            }

            function mostrarAvisoSalvo(elemento) {
                elemento.classList.add('salvo-sucesso');
                setTimeout(() => elemento.classList.remove('salvo-sucesso'), 600);
                
                const aviso = document.getElementById('aviso-salvo');
                aviso.classList.remove('opacity-0');
                setTimeout(() => aviso.classList.add('opacity-0'), 1500);
            }

            // Inicia o app
            window.onload = init;

        } catch (fatalError) {
            console.error("Erro fatal ao inicializar o script:", fatalError);
        }
    </script>
</body>
</html>
