<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Central de Fichas - PetLojas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-50 relative">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center px-4 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-address-book"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-2">Diretório PetLojas</h1>
            <p class="text-slate-500 text-sm mb-6">Acesso restrito a administradores.</p>
            <button onclick="loginComGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 shadow-md">
                <i class="fa-brands fa-google text-lg"></i> Entrar com o Google
            </button>
            <p id="loginError" class="hidden mt-4 text-sm text-red-500 font-bold bg-red-50 p-3 rounded-lg border border-red-200"></p>
        </div>
    </div>

    <div id="mainApp" class="hidden flex-col h-full w-full">
        <header class="bg-white border-b border-slate-200 p-4 shrink-0 shadow-sm">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center w-full md:w-auto justify-between">
                    <h1 class="text-xl md:text-2xl font-black text-slate-800 flex items-center">
                        <i class="fa-solid fa-address-book mr-2 text-indigo-600"></i> Painel de Fichas
                    </h1>
                    <button onclick="window.location.href='../'" class="md:hidden text-slate-500 hover:text-indigo-600 transition p-2 bg-slate-100 rounded-lg">
                        <i class="fa-solid fa-arrow-left"></i> CRM
                    </button>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative flex-1 md:w-80">
                        <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" id="searchInput" onkeyup="filtrarTabela()" placeholder="Buscar por nome ou telefone..." class="w-full pl-9 pr-4 py-2.5 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium text-slate-700">
                    </div>
                    <button onclick="window.location.href='../'" class="hidden md:flex text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2.5 rounded-xl text-sm font-bold transition-all items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-arrow-left"></i> Voltar ao Kanban
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-auto p-4 md:p-6 custom-scrollbar">
            <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse" id="tabelaFichas">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-widest border-b border-slate-200">
                                <th class="p-4 font-bold">Cliente / Empresa</th>
                                <th class="p-4 font-bold">Contato</th>
                                <th class="p-4 font-bold hidden md:table-cell">Endereço</th>
                                <th class="p-4 font-bold">Valor (R$)</th>
                                <th class="p-4 font-bold">Status (Funil)</th>
                                <th class="p-4 font-bold text-center">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-sm divide-y divide-slate-100">
                            <tr>
                                <td colspan="6" class="p-8 text-center text-slate-400 font-bold">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i><br>A carregar base de dados...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // CONFIGURAÇÃO FIREBASE E AUTENTICAÇÃO
        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const ADMIN_EMAILS = ["professoragiselle.edu2@gmail.com", "gvconecta2025@gmail.com"];

        let columnsMap = {};
        let allLeads = [];

        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('loginScreen');
            const mainApp = document.getElementById('mainApp');
            if (user && ADMIN_EMAILS.includes(user.email)) {
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                mainApp.classList.add('flex');
                carregarDados();
            } else {
                if (user) { document.getElementById('loginError').innerText = "Sem permissão."; auth.signOut(); }
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        function loginComGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        function formatMoney(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0); }

        async function carregarDados() {
            // 1. Carrega o nome das colunas para sabermos o "Status"
            db.collection('columns').onSnapshot(snap => {
                columnsMap = {};
                snap.forEach(doc => { columnsMap[doc.id] = doc.data().title; });
                renderTabela(); // Re-renderiza a tabela quando as colunas chegarem
            });

            // 2. Carrega todos os leads
            db.collection('leads').onSnapshot(snap => {
                allLeads = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Ordena por data de criação (mais recentes primeiro)
                allLeads.sort((a, b) => b.createdAt - a.createdAt);
                renderTabela();
            });
        }

        function renderTabela() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if(allLeads.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><br>Nenhum lead encontrado.</td></tr>`;
                return;
            }

            allLeads.forEach(lead => {
                const statusName = columnsMap[lead.columnId] || "Desconhecido";
                const isFechado = statusName.trim().toLowerCase() === 'fechado';
                const statusColor = isFechado ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-100 text-slate-600 border-slate-200';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/50 transition-colors group";
                
                tr.innerHTML = `
                    <td class="p-4">
                        <p class="font-bold text-slate-800 search-target">${lead.name}</p>
                    </td>
                    <td class="p-4">
                        <p class="font-mono text-xs text-slate-600 search-target">${lead.phone || '-'}</p>
                    </td>
                    <td class="p-4 hidden md:table-cell">
                        <p class="text-xs text-slate-500 truncate max-w-[200px]">${lead.address || '-'}</p>
                    </td>
                    <td class="p-4">
                        <p class="font-black ${isFechado ? 'text-blue-600' : 'text-green-600'}">${formatMoney(lead.dealValue)}</p>
                    </td>
                    <td class="p-4">
                        <span class="text-[10px] font-bold px-2.5 py-1 rounded-md border ${statusColor} uppercase tracking-wide whitespace-nowrap">${statusName}</span>
                    </td>
                    <td class="p-4 text-center">
                        <a href="../ficha-cadastro/index.html?id=${lead.id}" target="_blank" rel="noopener noreferrer" class="bg-white border border-slate-200 hover:border-indigo-400 hover:text-indigo-600 text-slate-400 w-8 h-8 rounded-lg flex items-center justify-center mx-auto transition-all shadow-sm">
                            <i class="fa-solid fa-up-right-from-square text-xs"></i>
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Filtro de Busca (Apenas Front-End)
        function filtrarTabela() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase().replace(/\D/g, '') || input.value.toLowerCase(); // Se for número, limpa traços. Se for texto, mantém.
            const rows = document.getElementById('tableBody').getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                const searchTargets = rows[i].getElementsByClassName('search-target');
                let match = false;
                
                if(searchTargets.length > 0) {
                    const nome = searchTargets[0].innerText.toLowerCase();
                    const telPuro = searchTargets[1].innerText.replace(/\D/g, ''); // Limpa máscara para comparar
                    const telVisual = searchTargets[1].innerText.toLowerCase(); // Compara com máscara também

                    if (nome.includes(input.value.toLowerCase()) || telPuro.includes(filter) || telVisual.includes(input.value.toLowerCase())) {
                        match = true;
                    }
                }

                if (match) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
