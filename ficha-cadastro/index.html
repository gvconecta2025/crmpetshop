<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM PetLojas - Diretório e Ficha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden font-sans text-gray-800">

    <nav class="w-20 bg-slate-900 flex flex-col items-center py-6 space-y-8 text-slate-400 border-r border-slate-800 shrink-0 z-20">
        <div class="text-emerald-400 text-2xl font-bold mb-4"><i class="fa-solid fa-paw"></i></div>
        <a href="../index.html" class="hover:text-white transition" title="Voltar ao Kanban"><i class="fa-solid fa-table-columns text-xl"></i></a>
        <a href="index.html" class="text-white bg-slate-800 p-3 rounded-lg transition" title="Diretório de Contatos"><i class="fa-solid fa-address-card text-xl"></i></a>
        <a href="#" class="hover:text-white transition" title="Agenda"><i class="fa-regular fa-calendar-check text-xl"></i></a>
    </nav>

    <div id="view-lista" class="hidden flex-1 flex-col bg-slate-50 overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-8 py-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Diretório de Leads</h1>
                <p class="text-sm text-gray-500 mt-1" id="status-mensagem">Conectando ao banco de dados...</p>
            </div>
        </header>
        
        <main class="flex-1 p-8 overflow-y-auto no-scrollbar">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 text-xs font-bold text-gray-500 uppercase">
                        <tr>
                            <th class="px-6 py-4 text-left">Nome do Lead</th>
                            <th class="px-6 py-4 text-left">Telefone</th>
                            <th class="px-6 py-4 text-left">Fase (Coluna)</th>
                            <th class="px-6 py-4 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-contatos" class="bg-white divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="view-detalhes" class="hidden flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-white border-r border-gray-200 flex flex-col shrink-0 no-scrollbar overflow-y-auto relative">
            <div class="p-6 border-b border-gray-100">
                <button onclick="window.location.href='index.html'" class="text-gray-400 hover:text-gray-600 mb-6 text-sm font-medium transition flex items-center">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Voltar à Lista
                </button>
                
                <div id="iniciais-cliente" class="flex items-center justify-center w-20 h-20 bg-blue-100 text-blue-600 rounded-full text-2xl font-bold mb-4 mx-auto uppercase">..</div>
                
                <h2 id="nome-empresa" class="text-xl font-bold text-center text-gray-900 leading-tight">Carregando...</h2>
                
                <div class="flex justify-center mt-3 mb-6">
                    <span id="tag-coluna" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full">Fase</span>
                </div>

                <div class="space-y-5 text-sm">
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Telefone Principal</p>
                        <p id="telefone-cliente" class="font-medium text-gray-800">...</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-slate-50 flex flex-col relative">
            <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10">
                <h3 class="text-lg font-bold text-gray-800">Linha do Tempo</h3>
            </header>
            <div class="flex-1 p-6 overflow-y-auto no-scrollbar">
                <p class="text-sm text-gray-500 italic">Módulo de histórico será ativado na próxima etapa.</p>
            </div>
        </main>

        <aside class="w-80 bg-white border-l border-gray-200 flex flex-col shrink-0">
            <header class="p-6 border-b border-gray-100 bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-check text-blue-600"></i> Agendamentos
                </h3>
            </header>
            <div class="p-6">
                <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl mb-4">
                    <input type="text" placeholder="Tarefa (ex: Retornar amanhã)" class="w-full mb-3 text-sm p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                    <div class="flex gap-2 mb-3">
                        <input type="date" class="w-full text-xs p-2 rounded border border-gray-300">
                        <input type="time" class="w-full text-xs p-2 rounded border border-gray-300">
                    </div>
                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 rounded transition shadow-md">Agendar</button>
                </div>
            </div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // Dicionário de Colunas (Para traduzir o ID no nome)
        // ==========================================
        let colunasDicionario = {};

        async function carregarDicionarioDeColunas() {
            const colsSnap = await getDocs(collection(db, "columns"));
            colsSnap.forEach(doc => {
                colunasDicionario[doc.id] = doc.data().title;
            });
        }

        async function iniciarSistema() {
            const parametros = new URLSearchParams(window.location.search);
            const idDoCard = parametros.get('id');

            // Primeiro carrega as colunas para sabermos os nomes das Fases
            await carregarDicionarioDeColunas();

            if (idDoCard) {
                document.getElementById('view-lista').classList.add('hidden');
                document.getElementById('view-detalhes').classList.remove('hidden');
                await puxarFichaDoCard(idDoCard);
            } else {
                document.getElementById('view-lista').classList.remove('hidden');
                document.getElementById('view-detalhes').classList.add('hidden');
                await puxarTodosOsCards();
            }
        }

        async function puxarTodosOsCards() {
            const statusMsg = document.getElementById('status-mensagem');
            const tabela = document.getElementById('tabela-contatos');
            
            try {
                // Aqui usamos exatamente o nome que está no seu código fonte: "leads"
                const querySnapshot = await getDocs(collection(db, "leads"));
                const cards = [];
                
                querySnapshot.forEach((doc) => {
                    cards.push({ id: doc.id, ...doc.data() });
                });

                if (cards.length === 0) {
                    statusMsg.innerHTML = `<span class="text-amber-500 font-bold">Conexão OK, mas não há leads cadastrados ainda.</span>`;
                    return;
                }

                statusMsg.innerHTML = `<span class="text-green-600 font-bold">${cards.length} leads carregados com sucesso!</span>`;
                tabela.innerHTML = ""; 

                cards.forEach(card => {
                    // Puxando os campos exatos do seu código Kanban
                    const nome = card.name || "Sem Nome";
                    const telefone = card.phone || "-";
                    // Traduz o código da coluna (ex: col-123) para o nome (ex: Prospecção)
                    const fase = colunasDicionario[card.columnId] || "Sem Fase";

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 border-b border-gray-100";
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-bold text-gray-900 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-xs uppercase shrink-0">${nome.substring(0,2)}</div>
                            <span class="truncate">${nome}</span>
                        </td>
                        <td class="px-6 py-4 text-gray-600">${telefone}</td>
                        <td class="px-6 py-4">
                            <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-bold uppercase">${fase}</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <a href="?id=${card.id}" class="text-xs bg-white border border-gray-200 px-3 py-1.5 rounded-lg font-bold shadow-sm hover:bg-slate-50">Abrir Ficha</a>
                        </td>
                    `;
                    tabela.appendChild(tr);
                });

            } catch (erro) {
                console.error(erro);
                statusMsg.innerHTML = `<span class="text-red-600 font-bold">Erro Crítico: ${erro.message}</span>`;
            }
        }

        async function puxarFichaDoCard(id) {
            try {
                const docSnap = await getDoc(doc(db, "leads", id));
                if (docSnap.exists()) {
                    const card = docSnap.data();
                    
                    const nome = card.name || "Sem Nome";
                    const telefone = card.phone || "-";
                    const fase = colunasDicionario[card.columnId] || "Sem Fase";

                    document.getElementById("nome-empresa").innerText = nome;
                    document.getElementById("telefone-cliente").innerText = telefone;
                    document.getElementById("tag-coluna").innerText = fase;
                    document.getElementById("iniciais-cliente").innerText = nome.substring(0, 2);
                } else {
                    alert("Este lead não foi encontrado no banco de dados.");
                    window.location.href = "index.html";
                }
            } catch (erro) {
                console.error(erro);
                alert("Ocorreu um erro ao tentar ler a ficha.");
            }
        }

        document.addEventListener('DOMContentLoaded', iniciarSistema);
    </script>
</body>
</html>
