<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM PetLojas - Ficha Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .salvo-sucesso { background-color: #d1fae5 !important; transition: background-color 0.5s ease; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden font-sans text-gray-800">

    <nav class="w-20 bg-slate-900 flex flex-col items-center py-6 space-y-8 text-slate-400 border-r border-slate-800 shrink-0 z-20">
        <div class="text-emerald-400 text-2xl font-bold mb-4"><i class="fa-solid fa-paw"></i></div>
        <a href="../index.html" class="hover:text-white transition" title="Voltar ao Kanban"><i class="fa-solid fa-table-columns text-xl"></i></a>
        <a href="index.html" class="text-white bg-slate-800 p-3 rounded-lg transition" title="Diretório"><i class="fa-solid fa-address-card text-xl"></i></a>
        <div class="flex-grow"></div>
    </nav>

    <div id="view-lista" class="hidden flex-1 flex-col bg-slate-50 overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-8 py-6 flex justify-between items-center z-10 sticky top-0">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Diretório Prospecção</h1>
                <p class="text-sm text-gray-500 mt-1" id="status-mensagem">Buscando leads...</p>
            </div>
            <input type="text" id="input-pesquisa" placeholder="Pesquisar..." class="pl-4 pr-4 py-2 border border-gray-300 rounded-lg w-80 text-sm">
        </header>
        <main class="flex-1 p-8 overflow-y-auto no-scrollbar">
            <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 text-xs font-bold text-gray-500 uppercase">
                        <tr>
                            <th class="px-6 py-4 text-left">Empresa</th>
                            <th class="px-6 py-4 text-left">Contato</th>
                            <th class="px-6 py-4 text-left">WhatsApp</th>
                            <th class="px-6 py-4 text-left">Fase</th>
                            <th class="px-6 py-4 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-contatos" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="view-detalhes" class="hidden flex-1 flex overflow-hidden">
        <aside class="w-[450px] bg-white border-r border-gray-200 flex flex-col shrink-0 no-scrollbar overflow-y-auto relative p-6">
            <div id="aviso-salvo" class="absolute top-2 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg opacity-0 transition-opacity z-50">Salvo!</div>
            <button onclick="window.location.href='index.html'" class="text-slate-500 mb-6 text-sm flex items-center bg-slate-100 px-3 py-1.5 rounded-lg w-fit">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar
            </button>
            
            <div class="flex gap-4 mb-6">
                <div class="relative group cursor-pointer" id="area-photo">
                    <img id="lead-photo" src="https://ui-avatars.com/api/?name=PS&background=e2e8f0" class="w-24 h-24 rounded-2xl border-4 border-slate-100 shadow-inner">
                    <input type="file" id="input-photo-upload" class="hidden" accept="image/*">
                </div>
                <div class="flex-1">
                    <h2 id="nome-empresa" contenteditable="true" class="text-2xl font-black outline-none border-b border-transparent hover:border-slate-200">...</h2>
                    <div class="flex gap-2 mt-2">
                        <span id="tag-coluna" class="px-2 py-1 bg-slate-100 text-[10px] font-black rounded uppercase">Fase</span>
                        <span id="deal-value-container" class="px-2 py-1 bg-slate-50 border rounded text-[10px] font-black">
                            R$ <span id="lead-dealValue" contenteditable="true">0,00</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Contato</p>
                    <p id="nome-contato" contenteditable="true" class="font-bold text-sm outline-none">...</p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Cidade</p>
                    <p id="lead-city" contenteditable="true" class="font-bold text-sm outline-none">...</p>
                </div>
                <div class="pt-4 border-t">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Telefones</p>
                    <div class="flex items-center gap-2 mb-2">
                        <input type="text" id="phone-fixed" class="font-bold text-sm bg-slate-50 p-2 rounded-lg flex-1 outline-none" placeholder="Fixo">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="phone-mobile" class="font-bold text-sm bg-slate-50 p-2 rounded-lg flex-1 outline-none" placeholder="WhatsApp">
                        <button id="btn-whatsapp" class="bg-emerald-500 text-white h-10 w-10 rounded-lg flex items-center justify-center"><i class="fa-brands fa-whatsapp text-xl"></i></button>
                    </div>
                </div>
                <div class="pt-4 border-t">
                    <div class="flex justify-between items-center mb-1">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Localização</p>
                        <button id="btn-maps" class="text-blue-600 text-[10px] font-bold bg-blue-50 px-2 py-1 rounded">Ver no Maps</button>
                    </div>
                    <p id="endereco-cliente" contenteditable="true" class="text-xs outline-none">...</p>
                </div>
                <div class="pt-4 border-t">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Descrição</p>
                    <div id="lead-description" contenteditable="true" class="text-xs outline-none min-h-[50px]">...</div>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-slate-50 flex flex-col p-6 overflow-y-auto no-scrollbar">
            <header class="mb-6"><h3 class="text-lg font-bold">Linha do Tempo</h3></header>
            <div id="container-historico" class="relative border-l-2 border-slate-200 ml-4 space-y-6">
                <p class="text-xs text-slate-400 pl-4 italic">Histórico será ativado em breve.</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let colunasDicionario = {};
        let todosOsLeads = [];
        let leadAtualId = null;

        const maskPhone = (v) => {
            if(!v) return "";
            let val = v.toString().replace(/\D/g, "");
            if(val.length > 10) return val.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
            if(val.length > 6) return val.replace(/^(\d{2})(\d{4})(\d{4})$/, "($1) $2-$3");
            return val;
        };

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const cols = await getDocs(collection(db, "columns"));
            cols.forEach(d => colunasDicionario[d.id] = d.data().title);

            if (id) {
                document.getElementById('view-detalhes').classList.remove('hidden');
                carregarFicha(id);
            } else {
                document.getElementById('view-lista').classList.remove('hidden');
                carregarLista();
            }
        }

        function carregarLista() {
            onSnapshot(collection(db, "leads"), (snap) => {
                todosOsLeads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('status-mensagem').innerText = `${todosOsLeads.length} prospectos.`;
                renderizar(todosOsLeads);
            });
        }

        function renderizar(lista) {
            const body = document.getElementById('tabela-contatos');
            body.innerHTML = '';
            lista.forEach(l => {
                const nome = l.name || l.nome || l.titulo || l.nomeEmpresa || "Sem Nome";
                const fase = colunasDicionario[l.columnId] || l.columnId || "-";
                const tr = document.createElement('tr');
                tr.className = "border-b text-sm hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold">${nome}</td>
                    <td class="px-6 py-4">${l.nomeContato || "-"}</td>
                    <td class="px-6 py-4">${maskPhone(l.phone || l.telefone)}</td>
                    <td class="px-6 py-4"><span class="bg-slate-100 px-2 py-1 rounded text-[10px] font-black uppercase">${fase}</span></td>
                    <td class="px-6 py-4 text-right"><a href="?id=${l.id}" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-black text-xs">ABRIR FICHA PRO</a></td>
                `;
                body.appendChild(tr);
            });
        }

        function carregarFicha(id) {
            leadAtualId = id;
            onSnapshot(doc(db, "leads", id), (snap) => {
                if (!snap.exists()) return;
                const d = snap.data();
                const nome = d.name || d.nome || d.titulo || "Sem Nome";
                const fase = colunasDicionario[d.columnId] || d.columnId || "-";

                document.getElementById("nome-empresa").innerText = nome;
                document.getElementById("tag-coluna").innerText = fase;
                document.getElementById("nome-contato").innerText = d.nomeContato || "Adicionar...";
                document.getElementById("phone-fixed").value = maskPhone(d.phoneFixed);
                document.getElementById("phone-mobile").value = maskPhone(d.phone || d.telefone);
                document.getElementById("endereco-cliente").innerText = d.address || d.endereco || "Adicionar...";
                
                if(d.photoUrl) document.getElementById("lead-photo").src = d.photoUrl;

                const btnW = document.getElementById("btn-whatsapp");
                let num = (d.phone || d.telefone || "").toString().replace(/\D/g, "");
                if(num) {
                    if(!num.startsWith("55")) num = "55" + num;
                    btnW.onclick = () => window.open(`https://wa.me/${num}`, '_blank');
                }

                document.getElementById("btn-maps").onclick = () => {
                    window.open(`https://www.google.com/maps/search/${encodeURIComponent(nome + ' ' + (d.address || ''))}`, '_blank');
                };
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
