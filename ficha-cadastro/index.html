<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ficha de Cliente - PetLojas V7.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .history-line { border-left: 2px solid #e2e8f0; margin-left: 10px; padding-left: 20px; position: relative; }
        .history-dot { width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; position: absolute; left: -7px; top: 5px; border: 2px solid white; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center px-4 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-address-card"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-2">Ficha PetLojas</h1>
            <p class="text-slate-500 text-sm mb-6">Identifique-se para acessar os dados.</p>
            <button onclick="loginComGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 shadow-md">
                <i class="fa-brands fa-google text-lg"></i> Acessar com Google
            </button>
            <p id="loginError" class="hidden mt-4 text-sm text-red-500 font-bold bg-red-50 p-3 rounded-lg border border-red-200"></p>
        </div>
    </div>

    <div id="mainApp" class="hidden flex-col flex-1 overflow-hidden">
        
        <header class="bg-white border-b border-slate-200 p-4 shrink-0">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <button onclick="window.location.href='https://crmpetshop.vercel.app/'" class="text-slate-500 hover:text-slate-800 flex items-center gap-2 text-sm font-bold transition">
                    <i class="fa-solid fa-arrow-left"></i> Voltar ao CRM
                </button>
                <div class="flex items-center gap-3">
                    <span class="text-[10px] bg-indigo-100 text-indigo-600 font-bold px-2 py-1 rounded uppercase tracking-tighter">Modo Edição</span>
                    <button onclick="fazerLogout()" class="text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar">
            <div class="max-w-4xl mx-auto space-y-6">

                <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Nome da Empresa / Lojista</label>
                                <input type="text" id="leadName" class="w-full text-xl md:text-2xl font-black text-slate-800 bg-slate-50 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ex: Pet Shop do João">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">WhatsApp / Telefone</label>
                                <div class="relative">
                                    <input type="text" id="leadPhone" class="w-full font-bold text-slate-600 bg-slate-50 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="(33) 99999-9999">
                                    <button onclick="abrirWhatsApp()" class="absolute right-2 top-2 bg-[#25D366] text-white p-1.5 rounded-lg hover:scale-105 transition"><i class="fa-brands fa-whatsapp text-lg px-1"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Endereço Completo</label>
                                <div class="relative">
                                    <textarea id="leadAddress" rows="2" class="w-full text-sm text-slate-600 bg-slate-50 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none resize-none" placeholder="Rua, Número, Bairro, Cidade..."></textarea>
                                    <button onclick="abrirMaps()" class="absolute right-2 bottom-2 bg-blue-100 text-blue-600 p-1.5 rounded-lg hover:bg-blue-200 transition"><i class="fa-solid fa-map-location-dot"></i></button>
                                </div>
                            </div>
                            <div class="bg-green-50 border border-green-100 rounded-2xl p-4 flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] font-bold text-green-600 uppercase">Valor do Negócio</p>
                                    <input type="text" id="leadDealValue" class="bg-transparent border-none p-0 font-black text-green-700 text-xl focus:ring-0 outline-none w-full" value="R$ 0,00">
                                </div>
                                <i class="fa-solid fa-sack-dollar text-green-200 text-3xl"></i>
                            </div>
                        </div>
                    </div>
                    <button onclick="salvarAlteracoes()" class="mt-8 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Salvar Dados da Ficha
                    </button>
                </section>

                <section class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="font-black text-slate-800 uppercase text-xs tracking-widest"><i class="fa-solid fa-timeline mr-2 text-indigo-500"></i> Histórico de Atendimento</h2>
                    </div>
                    
                    <div class="p-6 space-y-6">
                        <div class="flex gap-2">
                            <input type="text" id="newNote" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Digite uma nova atualização aqui...">
                            <button onclick="adicionarNota()" class="bg-indigo-600 text-white px-6 rounded-xl font-bold hover:bg-indigo-700 transition">Enviar</button>
                        </div>

                        <div id="historyList" class="space-y-6 py-4">
                            </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script>
        // CONFIGURAÇÃO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBjuvcJvTWw7lMrIwej5lHbIUXe99lJDN4",
            authDomain: "crmpetshop.firebaseapp.com",
            projectId: "crmpetshop",
            storageBucket: "crmpetshop.firebasestorage.app",
            messagingSenderId: "381013124221",
            appId: "1:381013124221:web:48f398a62ce40b7db6fd14"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const ADMIN_EMAILS = ["professoragiselle.edu2@gmail.com", "gvconecta2025@gmail.com"];
        let currentLeadId = new URLSearchParams(window.location.search).get('id');
        let leadData = null;

        // AUTH CHECK
        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('loginScreen');
            const mainApp = document.getElementById('mainApp');
            if (user && ADMIN_EMAILS.includes(user.email)) {
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                mainApp.classList.add('flex');
                carregarFicha();
            } else {
                if (user) { document.getElementById('loginError').innerText = "Sem permissão."; auth.signOut(); }
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        function loginComGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function fazerLogout() { auth.signOut(); }

        // CARREGAR DADOS DO CLIENTE
        function carregarFicha() {
            if(!currentLeadId) { alert("Nenhum cliente selecionado!"); window.location.href="../"; return; }
            
            db.collection('leads').doc(currentLeadId).onSnapshot((doc) => {
                if (!doc.exists) return;
                leadData = doc.data();
                document.getElementById('leadName').value = leadData.name || '';
                document.getElementById('leadPhone').value = leadData.phone || '';
                document.getElementById('leadAddress').value = leadData.address || '';
                document.getElementById('leadDealValue').value = formatMoney(leadData.dealValue || 0);
                renderizarHistorico(leadData.history || []);
            });
        }

        // LÓGICA DO HISTÓRICO (Weekday + Days Ago)
        function renderizarHistorico(history) {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
            const hoje = new Date();
            hoje.setHours(0,0,0,0);

            // Ordena histórico do mais novo para o mais antigo
            const sortedHistory = [...history].sort((a,b) => b.createdAt - a.createdAt);

            sortedHistory.forEach((item, index) => {
                const dataItem = new Date(item.createdAt);
                const diaSemana = diasSemana[dataItem.getDay()];
                const dataFormatada = dataItem.toLocaleDateString('pt-BR');
                const horaFormatada = dataItem.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

                // Cálculo de dias passados
                const dataCalculo = new Date(item.createdAt);
                dataCalculo.setHours(0,0,0,0);
                const diffTempo = Math.abs(hoje - dataCalculo);
                const diffDias = Math.floor(diffTempo / (1000 * 60 * 60 * 24));
                let labelDias = diffDias === 0 ? "Hoje" : diffDias === 1 ? "Ontem" : `Há ${diffDias} dias`;

                list.innerHTML += `
                    <div class="history-line">
                        <div class="history-dot"></div>
                        <p class="text-sm text-slate-700 font-medium leading-relaxed">${item.text}</p>
                        <div class="flex gap-2 mt-1">
                            <span class="text-[10px] text-slate-400 font-bold uppercase"><i class="fa-regular fa-clock mr-1"></i> ${diaSemana}, ${dataFormatada} às ${horaFormatada}</span>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">• ${labelDias}</span>
                        </div>
                    </div>
                `;
            });

            if(history.length === 0) {
                list.innerHTML = '<div class="text-center py-10 opacity-30"><i class="fa-solid fa-box-open text-4xl mb-2"></i><p class="text-sm font-bold">Nenhuma nota registrada.</p></div>';
            }
        }

        // AÇÕES
        async function salvarAlteracoes() {
            const cleanValue = document.getElementById('leadDealValue').value.replace(/\D/g, '');
            const rawValue = cleanValue ? parseFloat(cleanValue) / 100 : 0;

            await db.collection('leads').doc(currentLeadId).update({
                name: document.getElementById('leadName').value,
                phone: document.getElementById('leadPhone').value,
                address: document.getElementById('leadAddress').value,
                dealValue: rawValue
            });
            alert("Dados salvos com sucesso!");
        }

        async function adicionarNota() {
            const input = document.getElementById('newNote');
            if(!input.value.trim()) return;
            const newHistory = leadData.history || [];
            newHistory.push({ text: input.value, createdAt: Date.now() });
            await db.collection('leads').doc(currentLeadId).update({ history: newHistory });
            input.value = '';
        }

        function formatMoney(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0); }

        // MÁSCARAS E ATALHOS
        document.getElementById('leadDealValue').addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if(!val) val = '0';
            e.target.value = formatMoney(parseFloat(val) / 100);
        });

        document.getElementById('leadPhone').addEventListener('input', (e) => {
            e.target.value = mascaraTelefoneInteligente(e.target.value);
        });

        function abrirWhatsApp() {
            let num = document.getElementById('leadPhone').value.replace(/\D/g, '');
            if (num.length >= 10 && !num.startsWith('55')) num = '55' + num;
            window.open(`https://api.whatsapp.com/send?phone=${num}`, '_blank');
        }

        function abrirMaps() {
            const addr = document.getElementById('leadAddress').value;
            if(addr) window.open(`https://www.google.com/maps/search/?api=1&query=$0{encodeURIComponent(addr)}`, '_blank');
        }
    </script>
</body>
</html>
